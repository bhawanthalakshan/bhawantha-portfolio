<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent! — Bhawantha Lakshan</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Poppins', sans-serif;
      background: #050814;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 70% 60% at 30% 20%, rgba(59,130,246,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(139,92,246,0.08) 0%, transparent 60%);
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(40px) scale(0.95); }
      to   { opacity:1; transform: translateY(0)    scale(1); }
    }
    .icon-wrap {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(16,185,129,0.1));
      border: 2px solid rgba(16,185,129,0.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: #34d399;
      margin: 0 auto 28px;
      animation: popIn 0.6s 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes popIn {
      from { transform: scale(0); }
      to   { transform: scale(1); }
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.8rem; font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 1rem; line-height: 1.7;
      margin-bottom: 32px;
    }
    .email-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      color: #60a5fa;
      padding: 6px 16px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 500;
      margin-bottom: 32px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      padding: 14px 32px; border-radius: 12px;
      font-size: 1rem; font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .back-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(59,130,246,0.4); }
    .countdown { margin-top: 20px; font-size: 0.8rem; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <i class="fa-solid fa-paper-plane"></i>
    </div>
    <h1>Message Sent! 🎉</h1>
    <p>
      Thanks for reaching out! Your message has been delivered to Bhawantha Lakshan.
      Expect a reply within <strong style="color:#f1f5f9;">24 hours</strong>.
    </p>
    <div class="email-badge">
      <i class="fa-solid fa-envelope"></i>
      bawanthalakshan419@gmail.com
    </div>
    <br />
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
      Back to Portfolio
    </a>
    <p class="countdown" id="countdown">Redirecting in <span id="secs">6</span>s…</p>
  </div>

  <script>
    // Auto-redirect countdown
    let s = 6;
    const el = document.getElementById('secs');
    const t = setInterval(() => {
      s--;
      if (el) el.textContent = s;
      if (s <= 0) { clearInterval(t); window.location.href = 'index.html'; }
    }, 1000);
  </script>
</body>
</html>
